<style>
  :root {
    --bg: #000000;
    --s2: #1c1c1e;
    --s3: #2c2c2e;
    --t1: #f5f5f7;
    --t2: #a1a1a6;
    --accent: #0a84ff;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", system-ui, sans-serif;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { background: var(--bg); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--t1);
    font-family: var(--font);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  main {
    max-width: calc(560px + 32px);
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 56px) max(16px, env(safe-area-inset-right)) 48px max(16px, env(safe-area-inset-left));
  }
  h1 { margin: 0; font-size: 2.5rem; font-weight: 700; line-height: 1.04; letter-spacing: -0.035em; }
  p { margin: 12px 0 0; font-size: 1.0625rem; color: var(--t2); }
  a {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    margin-top: 24px;
    padding: 0 20px;
    border-radius: 999px;
    background: var(--s2);
    color: var(--t1);
    font-size: 0.9375rem;
    font-weight: 600;
    text-decoration: none;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    outline: 2px solid transparent;
    outline-offset: 6px;
    transition: background-color 150ms, outline-color 150ms, outline-offset 300ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  a:focus-visible { outline-color: var(--accent); outline-offset: 2px; }
  a:active { background: var(--s3); }
  @media (hover: hover) and (pointer: fine) { a:hover { background: var(--s3); } }
  @media (min-width: 768px) { main { padding-top: 96px; } h1 { font-size: 4rem; letter-spacing: -0.04em; } }
</style>
</head>
<body>
<main>
  <h1>Nie znaleziono strony</h1>
  <p>Pod tym adresem nie ma planu zajęć. Sprawdź kod grupy albo wybierz ją z listy.</p>
  <a href="@@BASE@@/">Wszystkie plany</a>
</main>
</body>
