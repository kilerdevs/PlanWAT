<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
@@CSP@@
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
@@THEME_HEAD@@
<meta name="robots" content="noindex">
<title>Nie znaleziono strony</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Crect x='13' y='16' width='38' height='35' rx='9' fill='none' stroke='%23f5f5f7' stroke-width='3.5'/%3E%3Cpath d='M13 27h38M24 11v9M40 11v9' stroke='%23f5f5f7' stroke-width='3.5' stroke-linecap='round'/%3E%3Ccircle cx='40' cy='39.5' r='4.5' fill='%230a84ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --s2: #1c1c1e;
    --s3: #2c2c2e;
    --t1: #f5f5f7;
    --t2: #a1a1a6;
    --accent: #0a84ff;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", system-ui, sans-serif;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { background: var(--bg); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--t1);
    font-family: var(--font);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100svh;
    display: flex;
    align-items: center;
  }
  main {
    width: 100%;
    max-width: calc(560px + 32px);
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 56px) max(16px, env(safe-area-inset-right)) 48px max(16px, env(safe-area-inset-left));
  }
  .mark { display: block; width: 52px; height: 52px; margin-bottom: 20px; color: var(--t2); }
  .mark .x { stroke: var(--accent); }
  h1 { margin: 0; font-size: 2.5rem; font-weight: 700; line-height: 1.04; letter-spacing: -0.035em; }
  p { margin: 12px 0 0; font-size: 1.0625rem; color: var(--t2); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
  a {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 0 20px;
    border-radius: 999px;
    background: var(--s2);
    color: var(--t1);
    font-size: 0.9375rem;
    font-weight: 600;
    text-decoration: none;
    box-shadow: inset 0 1px 0 rgba(var(--hl), 0.06);
    outline: 2px solid transparent;
    outline-offset: 6px;
    transition: background-color 150ms, outline-color 150ms, outline-offset 300ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  a.ghost { background: transparent; box-shadow: inset 0 0 0 1px rgba(var(--hl), 0.14); }
  a:focus-visible { outline-color: var(--accent); outline-offset: 2px; }
  a:active { background: var(--s3); }
  @media (hover: hover) and (pointer: fine) { a:hover { background: var(--s3); } a.ghost:hover { background: var(--s2); } }
  @media (prefers-reduced-motion: no-preference) {
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
    .enter { animation: rise 600ms cubic-bezier(0.22, 1, 0.36, 1) backwards; animation-delay: calc(var(--d, 0) * 55ms); }
    .d1 { --d: 1; } .d2 { --d: 2; } .d3 { --d: 3; }
  }
  @media (min-width: 768px) { main { padding-top: 96px; } h1 { font-size: 4rem; letter-spacing: -0.04em; } .mark { width: 64px; height: 64px; } }
/*@@THEME_CSS@@*/
</style>
</head>
<body>
<main>
  <svg class="mark enter" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
    <rect x="9" y="13" width="46" height="42" rx="11" fill="none" stroke="currentColor" stroke-width="3.5"/>
    <path d="M9 26h46M22 7v10M42 7v10" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    <path class="x" d="m25 36 14 14M39 36 25 50" fill="none" stroke-width="4" stroke-linecap="round"/>
  </svg>
  <h1 class="enter d1">Nie znaleziono strony</h1>
  <p class="enter d2">Pod tym adresem nie ma planu zajęć. Sprawdź kod grupy albo wybierz ją z listy.</p>
  <div class="actions enter d3">
    <a href="@@BASE@@/">Wszystkie plany</a>
    <a class="ghost" href="@@BASE@@/mapa/">Mapa kampusu</a>
  </div>
</main>
</body>
</html>
