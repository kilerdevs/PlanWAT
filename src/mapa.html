<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" integrity="sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj" crossorigin="anonymous" defer></script>
<style>
  :root {
    --bg: #000000;
    --s1: #111113;
    --s2: #1c1c1e;
    --s3: #2c2c2e;
    --s4: #3a3a3c;
    --t1: #f5f5f7;
    --t2: #a1a1a6;
    --t3: #86868b;
    --line: rgba(255, 255, 255, 0.08);
    --line-2: rgba(255, 255, 255, 0.14);
    --accent: #0a84ff;
    --accent-text: #4da3ff;
    --accent-soft: rgba(10, 132, 255, 0.14);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", system-ui, sans-serif;
    --r-card: 16px;
    --r-ctl: 12px;
    --r-pill: 999px;
    --top: max(12px, env(safe-area-inset-top));
    --gl: max(12px, env(safe-area-inset-left));
    --gr: max(12px, env(safe-area-inset-right));
    --bldg-scale: 1;
    --bldg-opacity: 1;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  * { -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  body {
    color: var(--t1);
    font-family: var(--font);
    font-size: 1rem;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  :where(a, button, summary, input):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  #map { position: fixed; inset: 0; background: #0e0e10; }

  /* floating controls: solid surfaces, no blur (phones lag on backdrop filters) */
  .ctl {
    background: var(--s2);
    color: var(--t1);
    border: 1px solid var(--line-2);
    border-radius: var(--r-ctl);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
    font: inherit;
    font-size: 0.875rem;
  }
  button.ctl { cursor: pointer; min-height: 40px; padding: 0 12px; }
  button.ctl:hover { background: var(--s3); }

  .back {
    position: fixed; z-index: 5; top: var(--top); left: var(--gl);
    display: inline-flex; align-items: center; gap: 4px; min-height: 40px; padding: 0 12px 0 8px;
    text-decoration: none; font-weight: 500;
  }
  .search {
    position: fixed; z-index: 6; top: var(--top); left: calc(var(--gl) + 96px); right: calc(var(--gr) + 52px);
    max-width: 420px;
  }
  .search input {
    width: 100%; min-height: 40px; padding: 0 12px;
    font-size: 1rem; /* 16px keeps iOS from zooming in */
  }
  .search input::placeholder { color: var(--t3); }
  .results {
    margin-top: 6px; max-height: min(60vh, 420px); overflow-y: auto; padding: 4px;
  }
  .result {
    display: flex; gap: 10px; align-items: flex-start; width: 100%; padding: 8px 10px; border: 0; border-radius: 10px;
    background: none; color: inherit; font: inherit; text-align: left; cursor: pointer;
  }
  .result:hover, .result:focus-visible { background: var(--s3); }
  .result .dot { width: 10px; height: 10px; margin-top: 6px; border-radius: 50%; background: var(--fc); flex: none; }
  .result b { display: block; font-weight: 600; font-size: 0.9375rem; }
  .result small { display: block; color: var(--t2); font-size: 0.8125rem; }
  .noresult { padding: 12px; text-align: center; color: var(--t3); font-size: 0.8125rem; }

  .tools {
    position: fixed; z-index: 5; top: calc(var(--top) + 52px); left: var(--gl);
    display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
  }
  .legend-body { padding: 4px; max-width: 300px; }
  .legend-row {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border: 0; border-radius: 10px;
    background: none; color: inherit; font: inherit; font-size: 0.875rem; text-align: left; cursor: pointer;
  }
  .legend-row:hover, .legend-row:focus-visible { background: var(--s3); }
  .legend-row .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--fc); flex: none; }
  .legend-row .n { margin-left: auto; color: var(--t3); font-variant-numeric: tabular-nums; }
  .row-btns { display: flex; gap: 8px; }
  .row-btns .ctl { min-width: 44px; font-weight: 600; }

  /* the sheet: bottom on phones, a side panel on wide screens */
  .sheet {
    position: fixed; z-index: 4; left: 0; right: 0; bottom: 0;
    max-height: 46vh; display: flex; flex-direction: column;
    background: var(--s1); border-top: 1px solid var(--line-2); border-radius: 20px 20px 0 0;
    box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.5);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .sheet > summary {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 14px max(16px, env(safe-area-inset-left)) 12px; cursor: pointer; list-style: none; font-weight: 600;
  }
  .sheet > summary::-webkit-details-marker { display: none; }
  .sheet > summary .hint { color: var(--t3); font-weight: 400; font-size: 0.8125rem; display: inline-flex; align-items: center; gap: 4px; }
  .sheet > summary .hint .i { transition: transform 200ms; }
  .sheet[open] > summary .hint .i { transform: rotate(180deg); }
  .sheet-body { overflow-y: auto; padding: 0 max(16px, env(safe-area-inset-left)) 16px; }
  .sheet h1 { margin: 0 0 4px; font-size: 1.25rem; line-height: 1.25; }
  .sheet h1 strong { color: var(--accent-text); }
  .sheet h2 { margin: 0; font-size: 1.0625rem; }
  .sheet p { margin: 0 0 8px; color: var(--t2); font-size: 0.9375rem; }
  .faculty { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 6px; color: var(--t2); font-size: 0.8125rem; }
  .faculty .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--fc); }
  .navigate {
    display: inline-flex; align-items: center; gap: 6px; margin: 4px 0 12px; padding: 9px 14px;
    background: var(--accent); color: #fff; border-radius: var(--r-pill); text-decoration: none; font-weight: 600; font-size: 0.9375rem;
  }
  .note { color: var(--t3); font-size: 0.8125rem; }
  .note a { color: var(--accent-text); }
  .day-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0; }
  .day-head .ctl { min-height: 34px; box-shadow: none; }
  .stops { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 6px; }
  .stops button {
    display: flex; gap: 10px; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-ctl);
    background: var(--s2); color: inherit; font: inherit; text-align: left; cursor: pointer;
  }
  .stops button:hover:not(:disabled) { background: var(--s3); }
  .stops button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .stops button:disabled { cursor: default; opacity: 0.7; }
  .stops .idx { color: var(--t3); font-variant-numeric: tabular-nums; }
  .stops .when { display: block; color: var(--t2); font-size: 0.8125rem; font-variant-numeric: tabular-nums; }
  .stops strong { display: block; font-weight: 600; }
  .stops small { display: block; color: var(--t2); font-size: 0.8125rem; }
  .fallback { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .fallback button { min-height: 34px; box-shadow: none; }

  .status {
    position: fixed; z-index: 3; left: 50%; top: 45%; transform: translate(-50%, -50%);
    max-width: calc(100vw - 48px); padding: 10px 14px; text-align: center; color: var(--t2); font-size: 0.875rem;
  }

  /* building markers */
  .bldg {
    width: 30px; height: 30px; padding: 0; border-radius: 50%;
    border: 2px solid rgba(0, 0, 0, 0.55);
    background: var(--fc); color: var(--fi);
    font: 700 0.6875rem/1 var(--font); font-variant-numeric: tabular-nums;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    cursor: pointer; opacity: var(--bldg-opacity);
  }
  .bldg > span { display: block; transform: scale(var(--bldg-scale)); }
  .bldg.wide { width: auto; min-width: 30px; padding: 0 6px; border-radius: 15px; }
  .bldg.on-day { border-color: #fff; box-shadow: 0 0 0 3px var(--accent), 0 1px 4px rgba(0, 0, 0, 0.6); opacity: 1; }
  .bldg[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 4px var(--accent); opacity: 1; z-index: 2; }

  /* MapLibre chrome in the dark theme */
  .maplibregl-ctrl-group { background: var(--s2) !important; border: 1px solid var(--line-2); }
  .maplibregl-ctrl-group button + button { border-top-color: var(--line-2) !important; }
  .maplibregl-ctrl-icon { filter: invert(1); }
  .maplibregl-ctrl-attrib { background: rgba(17, 17, 19, 0.85) !important; color: var(--t2); }
  .maplibregl-ctrl-attrib a { color: var(--t1) !important; }
  .maplibregl-ctrl-attrib-button { filter: invert(1); }
  .maplibregl-ctrl-top-right { top: calc(var(--top) - 10px); right: calc(var(--gr) - 10px); }

  @media (max-width: 800px) {
    .search { left: calc(var(--gl) + 88px); right: calc(var(--gr) + 52px); }
    .back { padding-right: 10px; }
    .maplibregl-ctrl-bottom-right, .maplibregl-ctrl-bottom-left { bottom: 64px; }
  }
  @media (min-width: 801px) {
    .sheet {
      left: var(--gl); right: auto; top: calc(var(--top) + 52px); bottom: 24px; width: 360px; max-height: none;
      border: 1px solid var(--line-2); border-radius: var(--r-card);
    }
    .sheet:not([open]) { bottom: auto; }
    .tools { left: calc(var(--gl) + 372px); }
    .search { max-width: 360px; left: calc(var(--gl) + 96px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .sheet > summary .hint .i { transition: none; }
  }
</style>
</head>

  <symbol id="i-chevron-up" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></symbol>

  <symbol id="i-maximize" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
</svg>

<a class="ctl back" id="back" href="../"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-chevron-left"/></svg>Plan</a>

<div class="search" id="searchWrap" role="search">
  <input class="ctl" type="search" id="q" aria-label="Szukaj budynku lub wydziału" aria-controls="results" placeholder="Budynek, wydział, biblioteka…" autocomplete="off" spellcheck="false" enterkeyhint="search">
  <div class="ctl results" id="results" hidden></div>
</div>

<div class="tools" id="tools">
  <div class="row-btns">
    <button class="ctl" type="button" id="legendToggle" aria-expanded="false" aria-controls="legendBody">Wydziały</button>
    <button class="ctl" type="button" id="toggle3d">2D</button>
    <button class="ctl" type="button" id="overview" aria-label="Pokaż cały kampus" title="Cały kampus"><svg class="i" aria-hidden="true" focusable="false"><use href="#i-maximize"/></svg></button>
  </div>
  <div class="ctl legend-body" id="legendBody" hidden></div>
</div>

<details class="sheet" id="sheet" open>
  <summary><span>Kampus WAT</span><span class="hint">Szczegóły <svg class="i" aria-hidden="true" focusable="false"><use href="#i-chevron-up"/></svg></span></summary>
  <div class="sheet-body" id="sheetBody">
    <div id="selection" aria-live="polite">
      <h1>Mapa kampusu WAT</h1>
      <p>Wybierz budynek na mapie albo wpisz jego numer w wyszukiwarce.</p>
    </div>
    <div id="day"></div>
    <p class="note">Nieoficjalna mapa; położenia budynków są przybliżone. Dane mapy © <a href="https://www.openstreetmap.org/copyright" rel="noopener noreferrer" target="_blank">OpenStreetMap</a> (ODbL), kafelki <a href="https://openfreemap.org" rel="noopener noreferrer" target="_blank">OpenFreeMap</a>, silnik MapLibre.</p>
  </div>
</details>

<div class="ctl status" id="status" role="status">Wczytywanie kampusu…</div>
<div id="map" role="region" aria-label="Interaktywna mapa kampusu WAT"></div>

<script>@@CAMPUS_JS@@</script>
<script>
(function () {
  'use strict';
  var C = window.Campus;
  var STYLE = 'https://tiles.openfreemap.org/styles/dark';
  var CENTER = [20.9005, 52.2527];
  var GROUP_RE = /^[A-Za-z0-9_]{2,32}$/;
  var ISO_RE = /^\d{4}-\d{2}-\d{2}$/;
  var reduced = matchMedia('(prefers-reduced-motion: reduce)');
  var phone = matchMedia('(max-width: 800px)');
  var params = new URLSearchParams(location.search);

  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function icon(name) {
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'i');
    svg.setAttribute('aria-hidden', 'true');
    svg.setAttribute('focusable', 'false');
    var use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
    use.setAttribute('href', '#i-' + name);
    svg.appendChild(use);
    return svg;
  }
  function dot(color, cls) { var d = el('span', cls || 'dot'); d.style.setProperty('--fc', color); return d; }
  function markerLabel(b) { return b.code === 'BIBL' ? 'B' : b.code || (/^Brama/.test(b.name) ? '↗' : '·'); }

  var map = null, pitched = true, markers = [];
  var sheet = $('sheet'), selection = $('selection');

  function padding() {
    if (phone.matches) return { top: 110, bottom: sheet.open ? Math.min(innerHeight * 0.46, 360) : 70, left: 40, right: 60 };
    return { top: 80, bottom: 60, left: sheet.open ? 420 : 80, right: 90 };
  }

  /* ---- the selected building in the sheet ---- */
  function showBuilding(b) {
    selection.replaceChildren();
    var fac = el('div', 'faculty');
    fac.appendChild(dot(b.faculty.color));
    fac.appendChild(document.createTextNode(b.faculty.label));
    selection.appendChild(fac);
    var h = el('h1');
    if (b.code && /^\d/.test(b.code)) { h.appendChild(document.createTextNode('Budynek ')); h.appendChild(el('strong', null, b.code)); }
    else h.textContent = b.name;
    selection.appendChild(h);
    if (b.desc && b.desc !== b.name) selection.appendChild(el('p', null, b.desc));
    var go = el('a', 'navigate');
    go.href = C.directionsUrl(b);
    go.target = '_blank';
    go.rel = 'noopener noreferrer';
    go.appendChild(icon('navigation'));
    go.appendChild(document.createTextNode('Wyznacz drogę pieszo'));
    selection.appendChild(go);
  }

  function select(b) {
    sheet.open = true;
    showBuilding(b);
    $('sheetBody').scrollTop = 0;
    markers.forEach(function (m) { m.el.setAttribute('aria-pressed', String(m.b === b)); });
    document.querySelectorAll('[data-stop]').forEach(function (s) { s.setAttribute('aria-pressed', String(s.getAttribute('data-code') === b.code)); });
    if (map) map.flyTo({ center: [b.lng, b.lat], zoom: 17.2, pitch: pitched ? 55 : 0, padding: padding(), duration: reduced.matches ? 0 : 850 });
  }

  function fit(list) {
    if (!map || !list.length) return;
    var lngs = list.map(function (b) { return b.lng; }), lats = list.map(function (b) { return b.lat; });
    map.fitBounds([[Math.min.apply(null, lngs), Math.min.apply(null, lats)], [Math.max.apply(null, lngs), Math.max.apply(null, lats)]],
      { padding: padding(), maxZoom: 17, pitch: pitched ? 55 : 0, duration: reduced.matches ? 0 : 850 });
  }

  /* ---- search ---- */
  var q = $('q'), results = $('results');
  function closeResults() { results.hidden = true; }
  function runSearch() {
    var found = C.search(q.value);
    if (!q.value.trim()) { results.replaceChildren(); closeResults(); return; }
    results.replaceChildren();
    if (!found.length) results.appendChild(el('div', 'noresult', 'Brak wyników'));
    found.forEach(function (b) {
      var btn = el('button', 'result');
      btn.type = 'button';
      btn.appendChild(dot(b.faculty.color));
      var t = el('span');
      t.appendChild(el('b', null, b.name));
      if (b.desc !== b.name) t.appendChild(el('small', null, b.desc));
      btn.appendChild(t);
      btn.addEventListener('click', function () {
        q.value = b.name;
        closeResults();
        if (phone.matches) q.blur();
        select(b);
      });
      results.appendChild(btn);
    });
    results.hidden = false;
  }
  q.addEventListener('input', runSearch);
  q.addEventListener('focus', function () { if (q.value.trim()) runSearch(); });
  q.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { var first = results.querySelector('.result'); if (first) first.click(); }
  });
  $('searchWrap').addEventListener('keydown', function (e) {
    var items = Array.prototype.slice.call(results.querySelectorAll('.result'));
    var i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown' && items.length) { e.preventDefault(); items[Math.min(i + 1, items.length - 1)].focus(); }
    else if (e.key === 'ArrowUp' && items.length) { e.preventDefault(); if (i <= 0) q.focus(); else items[i - 1].focus(); }
    else if (e.key === 'Escape') { closeResults(); q.focus(); }
  });
  $('searchWrap').addEventListener('focusout', function (e) {
    if (!(e.relatedTarget instanceof Node && $('searchWrap').contains(e.relatedTarget))) closeResults();
  });

  /* ---- legend ---- */
  var legendToggle = $('legendToggle'), legendBody = $('legendBody');
  function setLegend(open) { legendBody.hidden = !open; legendToggle.setAttribute('aria-expanded', String(open)); }
  C.FACULTIES.forEach(function (f) {
    var members = C.BUILDINGS.filter(function (b) { return b.faculty === f; });
    if (!members.length) return;
    var row = el('button', 'legend-row');
    row.type = 'button';
    row.appendChild(dot(f.color));
    row.appendChild(el('span', null, f.label));
    row.appendChild(el('span', 'n', String(members.length)));
    row.addEventListener('click', function () { setLegend(false); fit(members); });
    legendBody.appendChild(row);
  });
  legendToggle.addEventListener('click', function () { setLegend(legendBody.hidden); });

  /* ---- "Twój dzień na kampusie": ?g=<GROUP>&d=YYYY-MM-DD ---- */
  var dayCodes = {};
  var group = params.get('g'), date = params.get('d');
  var dayMode = !!(group && date && GROUP_RE.test(group) && ISO_RE.test(date));
  if (dayMode) $('back').href = '../' + encodeURIComponent(group) + '/';

  function renderDay(stops) {
    var box = $('day');
    box.replaceChildren();
    var codes = {};
    stops.forEach(function (s) { if (s.building) codes[s.building.code] = s.building; });
    var buildings = Object.keys(codes).map(function (k) { return codes[k]; });
    dayCodes = codes;
    markers.forEach(function (m) { m.el.classList.toggle('on-day', !!(m.b.code && codes[m.b.code])); });

    selection.replaceChildren(el('h1', null, 'Twój dzień na kampusie'));
    var when = new Date(date + 'T12:00:00').toLocaleDateString('pl-PL', { weekday: 'long', day: 'numeric', month: 'long' });
    selection.appendChild(el('p', null, group + ' · ' + when + '. ' +
      (stops.length ? 'Zajęcia: ' + stops.length + ', budynki: ' + buildings.length + '. Wybierz zajęcia, a mapa przybliży budynek.' : 'Tego dnia nie ma zajęć w planie.')));
    if (!stops.length) return;

    var head = el('div', 'day-head');
    head.appendChild(el('h2', null, 'Zajęcia'));
    if (buildings.length) {
      var all = el('button', 'ctl', 'Pokaż na mapie');
      all.type = 'button';
      all.id = 'fitDay';
      all.addEventListener('click', function () { fit(buildings); });
      head.appendChild(all);
    }
    box.appendChild(head);
    var ol = el('ol', 'stops');
    stops.forEach(function (s, i) {
      var li = el('li'), btn = el('button');
      btn.type = 'button';
      btn.setAttribute('data-stop', String(i));
      btn.setAttribute('data-code', s.building ? s.building.code : '');
      btn.setAttribute('aria-pressed', 'false');
      btn.disabled = !s.building;
      btn.appendChild(el('span', 'idx', (i + 1) + '.'));
      var t = el('span');
      t.appendChild(el('span', 'when', s.start + '–' + s.end + (s.type ? ' · ' + s.type : '')));
      t.appendChild(el('strong', null, s.subject));
      t.appendChild(el('small', null, (s.room && s.room !== '-' ? s.room : 'Sala niepodana') + (s.building ? '' : ' · brak lokalizacji')));
      btn.appendChild(t);
      if (s.building) btn.addEventListener('click', function () { select(s.building); });
      li.appendChild(btn);
      ol.appendChild(li);
    });
    box.appendChild(ol);
    box.appendChild(el('p', 'note', '„Brak lokalizacji” oznacza, że nie znamy położenia budynku. Zmiany sprawdzaj w e-dziekanacie.'));
  }

  function loadDay() {
    return fetch('../' + encodeURIComponent(group) + '/plan.ics', { credentials: 'same-origin' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
      .then(function (buf) {
        var plan = PlanICS.toPlan(PlanICS.parse(PlanICS.decode(buf)));
        renderDay(C.dayStops(plan, date));
      })
      .catch(function () {
        $('day').replaceChildren(el('p', 'note', 'Nie udało się wczytać planu grupy ' + group + '.'));
      });
  }

  function idle() {
    var hint = el('p', 'note');
    hint.appendChild(document.createTextNode('Otwórz mapę z planu swojej grupy (ikona mapy przy dniu), aby zobaczyć budynki swoich zajęć.'));
    $('day').replaceChildren(hint);
  }

  /* ---- deep link: ?b=65 ---- */
  function openDeepLink() {
    var code = params.get('b');
    if (!code) return false;
    var b = C.findBuilding(code.slice(0, 8));
    if (b) { select(b); return true; }
    q.value = code.slice(0, 40);
    runSearch();
    return false;
  }

  /* ---- no map engine (blocked CDN, offline, no WebGL): a plain list still gives directions ---- */
  function fallback() {
    $('status').textContent = 'Mapa jest niedostępna. Możesz nadal wybrać budynek i otworzyć nawigację.';
    $('tools').hidden = true;
    var box = el('div', 'fallback');
    C.BUILDINGS.forEach(function (b) {
      var btn = el('button', 'ctl', b.name);
      btn.type = 'button';
      btn.addEventListener('click', function () { select(b); });
      box.appendChild(btn);
    });
    $('sheetBody').insertBefore(box, $('day').nextSibling);
    sheet.open = true;
  }

  function startMap() {
    if (typeof maplibregl === 'undefined') throw new Error('no map engine');  // the Map constructor throws without WebGL
    map = new maplibregl.Map({
      container: 'map',
      style: STYLE,
      center: CENTER,
      zoom: 15.6,
      pitch: 55,
      bearing: -17,
      maxBounds: C.BOUNDS,
      attributionControl: { compact: true },
      antialias: !phone.matches,
      cooperativeGestures: false
    });
    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
    // A failed tile or glyph is not fatal and MapLibre keeps rendering; listening stops it logging each one.
    map.on('error', function () {});
    var slow = setTimeout(function () { $('status').textContent = 'Mapa ładuje się dłużej. Wyszukiwanie budynków nadal działa.'; }, 18000);
    map.on('load', function () {
      clearTimeout(slow);
      $('status').hidden = true;
      try {
        var style = map.getStyle();
        var source = Object.keys(style.sources).filter(function (k) { return style.sources[k].type === 'vector'; })[0];
        var firstSymbol = (style.layers.filter(function (l) { return l.type === 'symbol'; })[0] || {}).id;
        if (source) {
          map.addLayer({
            id: 'buildings-3d', type: 'fill-extrusion', source: source, 'source-layer': 'building', minzoom: 14,
            paint: {
              'fill-extrusion-color': ['interpolate', ['linear'], ['coalesce', ['get', 'render_height'], 8], 0, '#232326', 25, '#2e2e32', 60, '#3a3a40'],
              'fill-extrusion-height': ['interpolate', ['linear'], ['zoom'], 14, 0, 15.5, ['coalesce', ['get', 'render_height'], 8]],
              'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
              'fill-extrusion-opacity': 0.85
            }
          }, firstSymbol);
        }
      } catch (e) { /* the flat map still works */ }
    });

    C.BUILDINGS.forEach(function (b) {
      var btn = el('button', 'bldg');
      btn.type = 'button';
      var label = markerLabel(b);
      if (label.length > 2) btn.classList.add('wide');
      btn.appendChild(el('span', null, label));
      btn.style.setProperty('--fc', b.faculty.color);
      btn.style.setProperty('--fi', C.inkOn(b.faculty.color));
      btn.title = b.name;
      btn.setAttribute('aria-label', b.name);
      btn.setAttribute('aria-pressed', 'false');
      btn.addEventListener('click', function () { select(b); });
      new maplibregl.Marker({ element: btn, anchor: 'center' }).setLngLat([b.lng, b.lat]).addTo(map);
      markers.push({ el: btn, b: b });
    });

    function scale() {
      var z = map.getZoom();
      document.documentElement.style.setProperty('--bldg-scale', String(z >= 17 ? 1 : z >= 16 ? 0.9 : z >= 15 ? 0.8 : 0.7));
      document.documentElement.style.setProperty('--bldg-opacity', z < 15 ? '0.75' : '1');
    }
    map.on('zoom', scale);
    scale();

    $('overview').addEventListener('click', function () {
      markers.forEach(function (m) { m.el.setAttribute('aria-pressed', 'false'); });
      fit(C.BUILDINGS);
    });
    var t3d = $('toggle3d');
    function label3d() {
      t3d.textContent = pitched ? '2D' : '3D';
      t3d.setAttribute('aria-label', pitched ? 'Przełącz na mapę 2D' : 'Przełącz na mapę 3D');
    }
    t3d.addEventListener('click', function () {
      pitched = !pitched;
      map.easeTo({ pitch: pitched ? 55 : 0, bearing: pitched ? -17 : 0, duration: reduced.matches ? 0 : 500 });
      label3d();
    });
    label3d();
  }

  function boot() {
    try { startMap(); } catch (e) { map = null; fallback(); }
    if (dayMode) {
      loadDay().then(function () {
        if (!openDeepLink()) {
          var list = Object.keys(dayCodes).map(function (k) { return dayCodes[k]; });
          if (!list.length || !map) return;
          if (map.loaded()) fit(list);
          else map.once('load', function () { fit(list); });
        }
      });
    } else {
      idle();
      openDeepLink();
    }
  }
  /* the engine script is deferred: wait for it, then start */
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
