<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Plany zajęć</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Crect x='13' y='16' width='38' height='35' rx='9' fill='none' stroke='%23f5f5f7' stroke-width='3.5'/%3E%3Cpath d='M13 27h38M24 11v9M40 11v9' stroke='%23f5f5f7' stroke-width='3.5' stroke-linecap='round'/%3E%3Ccircle cx='40' cy='39.5' r='4.5' fill='%230a84ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --s2: #1c1c1e;
    --s3: #2c2c2e;
    --t1: #f5f5f7;
    --t2: #a1a1a6;
    --t3: #86868b;
    --line: rgba(255, 255, 255, 0.08);
    --edge: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    --accent: #0a84ff;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", system-ui, sans-serif;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { background: var(--bg); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--t1);
    font-family: var(--font);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  ::selection { background: rgba(10, 132, 255, 0.45); color: #fff; }
  main {
    max-width: calc(560px + 32px);
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 56px) max(16px, env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  h1 { margin: 0; font-size: 2.5rem; font-weight: 700; line-height: 1.04; letter-spacing: -0.035em; }
  .lead { margin: 8px 0 0; font-size: 1.0625rem; color: var(--t2); }
  h2 { margin: 40px 0 12px; padding: 0 4px; font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; }
  ul {
    margin: 0;
    padding: 0;
    list-style: none;
    border-radius: 20px;
    background: var(--s2);
    box-shadow: var(--edge);
    overflow: hidden;
  }
  li + li { border-top: 1px solid var(--line); }
  .group {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 60px;
    padding: 12px 16px;
    color: inherit;
    text-decoration: none;
    outline: 2px solid transparent;
    outline-offset: -2px;
    transition: background-color 150ms, outline-color 150ms;
  }
  .group:focus-visible { outline-color: var(--accent); }
  .group:active { background: var(--s3); }
  .code { display: block; font-size: 1.0625rem; font-weight: 600; letter-spacing: -0.012em; }
  .term { display: block; margin-top: 2px; font-size: 0.8125rem; color: var(--t2); }
  .chev {
    flex: none;
    width: 18px;
    height: 18px;
    margin-left: auto;
    color: var(--t3);
    fill: none;
    stroke: currentColor;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  footer { margin-top: 32px; padding: 0 4px; font-size: 0.8125rem; color: var(--t3); }
  @media (hover: hover) and (pointer: fine) { .group:hover { background: var(--s3); } }
  @media (min-width: 768px) {
    main { padding-top: calc(env(safe-area-inset-top) + 96px); }
    h1 { font-size: 4rem; letter-spacing: -0.04em; }
  }
</style>
</head>
<body>
<main>
  <h1>Plany zajęć</h1>
  <p class="lead">Wybierz swoją grupę.</p>
@@GROUPS@@
  <footer>Nieoficjalny plan zajęć. Zmiany i terminy dodatkowe sprawdzaj w e-dziekanacie.</footer>
</main>
</body>
</html>
