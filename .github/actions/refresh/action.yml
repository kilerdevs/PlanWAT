name: Refresh timetables
description: >
  Crawl the faculty timetable pages, convert what changed, push the calendars to the data branch and
  report whether the run was blocked or incomplete. Used by refresh.yml on each of the project's runners and by
  volunteer.yml on a volunteer's.

inputs:
  token:
    description: Token with contents write access (no actions access needed).
    required: true
  profile:
    description: Pacing profile, hosted or selfhosted.
    default: hosted
  faculty:
    description: Comma-separated faculties; empty means every enabled one.
    default: ''
  max-minutes:
    description: Stop gracefully after this many minutes.
    default: '100'
  max-block-wait-minutes:
    description: >
      How long to wait out a wall before letting the faculty go. refresh.yml shortens it when another runner is up to
      take the faculty over.
    default: '30'
  adaptive-hours:
    description: Cap (hours) for how far an unchanged group may stretch its revalidation gap (0 rechecks every pass).
    default: '4'
  source:
    description: Workspace path of the checked-out repository that holds tools/refresh.
    default: src
  mode:
    description: >
      project (the home runner: push the data branch, file issues) or volunteer (crawl this login's share of
      the upstream project and push a bundle to the crawl branch of this repository, a fork; see docs/WOLONTARIUSZE.md).
    default: project
  upstream:
    description: Volunteer mode only, the project whose data branch and registry are read.
    default: kilerdevs/PlanWAT
  registry-editors:
    description: Volunteer mode only, the logins whose verified commits may set the registry.
    default: kilerdevs

outputs:
  blocked:
    description: 'true when a host blocked the crawl'
    value: ${{ steps.run.outputs.blocked }}
  incomplete:
    description: 'true when some groups were not checked'
    value: ${{ steps.run.outputs.incomplete }}
  degraded:
    description: 'true when mass skips/degradation detected'
    value: ${{ steps.run.outputs.degraded }}
  blocked-faculties:
    description: Comma-separated faculties that ended this pass blocked
    value: ${{ steps.run.outputs.blocked_faculties }}
  incomplete-faculties:
    description: Comma-separated faculties this pass did not finish (the blocked ones included)
    value: ${{ steps.run.outputs.incomplete_faculties }}
  changed:
    description: Number of calendars that changed
    value: ${{ steps.run.outputs.changed }}
  pushed:
    description: 'true when the data branch received a commit this run (project mode)'
    value: ${{ steps.push.outputs.pushed }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # A volunteer reads the project's own data (public), never its fork's copy.
        repository: ${{ inputs.mode == 'volunteer' && inputs.upstream || github.repository }}
        ref: data
        path: data
        token: ${{ inputs.token }}
        persist-credentials: ${{ inputs.mode != 'volunteer' }}
    - if: runner.environment == 'github-hosted'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'
    - shell: bash
      run: |
        # Dependencies go into a throwaway venv on writable scratch: the self-hosted runner's baked
        # /opt/venv is read-only at job time (container hardening), so `pip install` there fails
        # with EROFS. $RUNNER_TEMP is writable on both hosted and self-hosted runners.
        python -m venv "$RUNNER_TEMP/planwat-venv"
        "$RUNNER_TEMP/planwat-venv/bin/python" -m pip install --disable-pip-version-check curl_cffi==0.13.0 pymupdf==1.28.2
        echo "PLANWAT_PY=$RUNNER_TEMP/planwat-venv/bin/python" >> "$GITHUB_ENV"
    - id: run
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
        FACULTY: ${{ inputs.faculty }}
        MAX_MINUTES: ${{ inputs.max-minutes }}
        BLOCK_WAIT: ${{ inputs.max-block-wait-minutes }}
        ADAPTIVE_HOURS: ${{ inputs.adaptive-hours }}
        SOURCE: ${{ inputs.source }}
        MODE: ${{ inputs.mode }}
        UPSTREAM: ${{ inputs.upstream }}
        EDITORS: ${{ inputs.registry-editors }}
        GH_TOKEN: ${{ inputs.token }}
        # The crawler posts a block notice here whenever a faculty answered a block page via a
        # pooled exit, so the egress can demote that exit (see tools/egress/server.py). Best
        # effort: on a runner with no egress box the posts just fail and the crawl continues.
        PLANWAT_EGRESS_BLOCK: http://egress:8080/api/block
        # The crawler also streams coarse live progress here (run/faculty/tick/done/wait, ticks
        # throttled) for the egress GUI's crawl card. Also best effort.
        PLANWAT_EGRESS_PROGRESS: http://egress:8080/api/progress
      run: |
        # Exit 3 (blocked) and 4 (incomplete) are results, not failures: they are reported through the outputs.
        set +e
        args=(--out data --profile "$PROFILE" --max-minutes "$MAX_MINUTES" --adaptive-hours "$ADAPTIVE_HOURS"
              --max-block-wait-minutes "$BLOCK_WAIT")
        if [ -n "$FACULTY" ]; then args+=(--faculty "$FACULTY"); fi
        if [ "$MODE" = volunteer ]; then
          # The registry comes from the project, not from the fork, and only from a commit GitHub verifies as
          # signed by a registry editor (tools/volunteer/registry.py): it decides who checks what.
          "$PLANWAT_PY" "$SOURCE/tools/volunteer/registry.py" --upstream "$UPSTREAM" --editors "$EDITORS" \
            --out "$RUNNER_TEMP/volunteers.json" || exit 1
          # Learned pacing and block cooldowns of this runner's own line, kept between runs in the tool cache.
          mkdir -p "$RUNNER_TOOL_CACHE/planwat"
          args+=(--assign "$RUNNER_TEMP/volunteers.json" --as "$GITHUB_REPOSITORY_OWNER"
                 --outcomes "$RUNNER_TEMP/outcomes.json" --faculty-state "$RUNNER_TOOL_CACHE/planwat/faculties.json")
        else
          # The push merges this pass into whatever the other runner pushed meanwhile (tools/refresh/fleet.py merge),
          # against the state the pass started from.
          cp data/refresh-state.json "$RUNNER_TEMP/state-base.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/state-base.json"
          # Each project runner meets its own walls: its learned pacing and block cooldowns stay in the tool cache,
          # seeded once from the data branch. A runner whose tool cache is not writable shares the branch's, as before.
          line="$RUNNER_TOOL_CACHE/planwat/refresh-line.json"
          if [ -f "$line" ] || "$PLANWAT_PY" "$SOURCE/tools/refresh/fleet.py" seed --state data/refresh-state.json --out "$line"; then
            args+=(--faculty-state "$line")
          fi
        fi
        "$PLANWAT_PY" "$SOURCE/tools/refresh/refresh.py" "${args[@]}"
        code=$?
        if [ "$code" -ne 0 ] && [ "$code" -ne 3 ] && [ "$code" -ne 4 ]; then exit "$code"; fi
        exit 0
    - id: bundle
      if: inputs.mode == 'volunteer'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        SOURCE: ${{ inputs.source }}
      run: |
        "$PLANWAT_PY" "$SOURCE/tools/volunteer/bundle.py" --data data --outcomes "$RUNNER_TEMP/outcomes.json" \
          --fork "$GITHUB_REPOSITORY"
    - id: push
      if: inputs.mode != 'volunteer'
      shell: bash
      working-directory: data
      env:
        SOURCE: ${{ inputs.source }}
        FACULTY: ${{ inputs.faculty }}
      run: |
        # Publish whatever was refreshed, even from a run that was blocked half-way. Another runner may push to the
        # same branch while this one crawls (other faculties, see tools/refresh/fleet.json), and so may the volunteer
        # coordinator: each attempt starts from the branch's newest commit, puts this pass's calendars back on top and
        # merges the state files instead of rebasing them into a conflict.
        git config user.name 'planwat-refresh'
        git config user.email 'planwat-refresh@users.noreply.github.com'
        fleet="$GITHUB_WORKSPACE/$SOURCE/tools/refresh/fleet.py"
        cp refresh-state.json "$RUNNER_TEMP/state-mine.json"
        git ls-files -z -m -o --exclude-standard -- . ':!refresh-state.json' | tar --null -T - -cf "$RUNNER_TEMP/publish.tar"
        for attempt in 1 2 3 4 5; do
          git fetch -q --depth 1 origin data
          git reset -q --hard FETCH_HEAD
          tar -xf "$RUNNER_TEMP/publish.tar"
          "$PLANWAT_PY" "$fleet" merge --base "$RUNNER_TEMP/state-base.json" --mine "$RUNNER_TEMP/state-mine.json" \
            --into refresh-state.json --faculty "$FACULTY"
          git add -A
          if git diff --cached --quiet; then
            echo 'nothing to publish'
            echo 'pushed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -q -m "Timetables refreshed ($(git diff --cached --name-only -- timetables | wc -l) calendars)"
          if git push -q origin HEAD:data; then
            echo 'pushed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "the data branch moved under the push (attempt $attempt); merging again"
          sleep $((attempt * 3 + RANDOM % 5))
        done
        exit 1
    # No `gh workflow run pages.yml` here on purpose: pages.yml rebuilds daily on its own and picks
    # the refreshed calendars up. Granting actions:write so the crawl could trigger deploys would let
    # anyone holding the refresh token (or a workflow patch) run arbitrary workflows.
    # Nor the "blocked" / "degraded" issues: the pass is split over several runners (refresh.yml), so only its
    # report job, which sees every runner's outcome, files and closes them.
