name: Refresh timetables
description: >
  Crawl the faculty timetable pages, convert what changed, push the calendars to the data branch and
  report whether the run was blocked or incomplete. Used by refresh.yml on a hosted and a self-hosted runner.

inputs:
  token:
    description: Token with contents and issues write access (no actions access needed).
    required: true
  profile:
    description: Pacing profile, hosted or selfhosted.
    default: hosted
  faculty:
    description: Comma-separated faculties; empty means every enabled one.
    default: ''
  max-minutes:
    description: Stop gracefully after this many minutes.
    default: '100'
  source:
    description: Workspace path of the checked-out repository that holds tools/refresh.
    default: src

outputs:
  blocked:
    description: 'true when a host blocked the crawl'
    value: ${{ steps.run.outputs.blocked }}
  incomplete:
    description: 'true when some groups were not checked'
    value: ${{ steps.run.outputs.incomplete }}
  changed:
    description: Number of calendars that changed
    value: ${{ steps.run.outputs.changed }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: data
        path: data
        token: ${{ inputs.token }}
    - if: runner.environment == 'github-hosted'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'
    - shell: bash
      run: |
        # Dependencies go into a throwaway venv on writable scratch: the self-hosted runner's baked
        # /opt/venv is read-only at job time (container hardening), so `pip install` there fails
        # with EROFS. $RUNNER_TEMP is writable on both hosted and self-hosted runners.
        python -m venv "$RUNNER_TEMP/planwat-venv"
        "$RUNNER_TEMP/planwat-venv/bin/python" -m pip install --disable-pip-version-check curl_cffi==0.13.0 pymupdf==1.28.2
        echo "PLANWAT_PY=$RUNNER_TEMP/planwat-venv/bin/python" >> "$GITHUB_ENV"
    - id: run
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
        FACULTY: ${{ inputs.faculty }}
        MAX_MINUTES: ${{ inputs.max-minutes }}
        SOURCE: ${{ inputs.source }}
      run: |
        # Exit 3 (blocked) and 4 (incomplete) are results, not failures: they are reported through the outputs.
        set +e
        args=(--out data --profile "$PROFILE" --max-minutes "$MAX_MINUTES")
        if [ -n "$FACULTY" ]; then args+=(--faculty "$FACULTY"); fi
        "$PLANWAT_PY" "$SOURCE/tools/refresh/refresh.py" "${args[@]}"
        code=$?
        if [ "$code" -ne 0 ] && [ "$code" -ne 3 ] && [ "$code" -ne 4 ]; then exit "$code"; fi
        exit 0
    - id: push
      shell: bash
      working-directory: data
      run: |
        # Publish whatever was refreshed, even from a run that was blocked half-way.
        git config user.name 'planwat-refresh'
        git config user.email 'planwat-refresh@users.noreply.github.com'
        git add -A
        if git diff --cached --quiet; then
          echo 'nothing to publish'
          echo 'pushed=false' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        git commit -q -m "Timetables refreshed ($(git diff --cached --name-only -- timetables | wc -l) calendars)"
        git pull -q --rebase origin data
        git push -q origin HEAD:data
        echo 'pushed=true' >> "$GITHUB_OUTPUT"
    # No `gh workflow run pages.yml` here on purpose: pages.yml rebuilds daily on its own and picks
    # the refreshed calendars up. Granting actions:write so the crawl could trigger deploys would let
    # anyone holding the refresh token (or a workflow patch) run arbitrary workflows.
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BLOCKED: ${{ steps.run.outputs.blocked }}
        INCOMPLETE: ${{ steps.run.outputs.incomplete }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        # One issue tells the owner that the crawl is blocked; it closes itself after a clean run.
        title='Odświeżanie planów zablokowane (Incapsula)'
        open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
        if [ "$BLOCKED" = 'true' ]; then
          body="Serwer wydziału zablokował pobieranie planów. Ostatnie poprawne plany zostają bez zmian. Przebieg: $RUN_URL"
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
        elif [ "$INCOMPLETE" != 'true' ] && [ -n "$open" ]; then
          gh issue close "$open" --repo "$GITHUB_REPOSITORY" --comment "Pobieranie znów działa: $RUN_URL"
        fi
