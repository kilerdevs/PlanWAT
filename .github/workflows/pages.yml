name: Pages

# Builds the site and deploys it to GitHub Pages. master is protected (signed
# commits, required CI checks), so whatever reaches it has passed CI.
#
# Two trees are published: production from master at the site root, and a
# preview of dev under /dev/ (linked from the production front page).
# Production is always built from master no matter which ref started the run,
# so a push to dev refreshes the preview without ever promoting dev content
# to the root.
on:
  push:
    branches: [master, dev]
  # Daily rebuild: build.py picks each group's current term by date, so a new
  # term goes live on its first day without anyone pushing a commit.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          path: prod
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          path: devsrc
      # Refreshed calendars live on the `data` branch (see refresh.yml). They are laid over the timetables
      # committed in each tree, so the site shows the latest plans without a commit to master or dev. Before the
      # branch exists, or if it cannot be fetched, the committed timetables are published as they are.
      - id: data
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: data
      - name: Overlay the refreshed timetables
        if: steps.data.outcome == 'success'
        run: |
          for tree in prod devsrc; do
            if [ -d data/timetables ]; then cp -r data/timetables/. "$tree/timetables/"; fi
            if [ -f data/refresh-state.json ]; then cp data/refresh-state.json "$tree/refresh-state.json"; fi
          done
          echo "overlaid $(find data/timetables -name '*.ics' | wc -l) refreshed calendars"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      # base_path is "/PlanWAT" on kilerdevs.github.io and empty once a custom
      # domain is set; the 404 page's links need it.
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build the production site
        run: python prod/build.py --out site --base-path "${{ steps.pages.outputs.base_path }}"
      - name: Build the dev preview
        run: python devsrc/build.py --out site/dev --base-path "${{ steps.pages.outputs.base_path }}/dev" --noindex
      # Cross-link the two front pages. Plain anchors only: no inline script or
      # style changes, so the hash-pinned CSPs stay valid.
      - name: Link production and preview
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          prod = Path('site/index.html')
          html = prod.read_text(encoding='utf-8')
          link = ' <a href="dev/">Wersja testowa (dev)</a>'
          assert link not in html and '</footer>' in html
          prod.write_text(html.replace('</footer>', link + '</footer>', 1), encoding='utf-8')
          dev = Path('site/dev/index.html')
          html = dev.read_text(encoding='utf-8')
          link = ' <a href="../">Wersja stabilna</a>'
          assert link not in html and '</footer>' in html
          dev.write_text(html.replace('</footer>', link + '</footer>', 1), encoding='utf-8')
          print('linked production <-> dev preview')
          EOF
      # The artifact includes dotfiles for .well-known/security.txt; the build markers are internal.
      - name: Drop build markers
        run: find site -name .planwat-site -delete
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
