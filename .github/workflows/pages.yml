name: Pages

# Builds the site and deploys it to GitHub Pages. master is protected (signed
# commits, required CI checks), so whatever reaches it has passed CI.
#
# Two trees are published: production from master at the site root, and a
# preview of dev under /dev/ (linked from the production front page).
# Production is always built from master no matter which ref started the run,
# so a push to dev refreshes the preview without ever promoting dev content
# to the root.
on:
  push:
    branches: [master, dev]
  # Daily rebuild: build.py picks each group's current term by date, so a new
  # term goes live on its first day without anyone pushing a commit.
  schedule:
    - cron: '17 3 * * *'
  # Publish refreshed timetables as soon as a refresh pass ends (it pushes the `data` branch with its own
  # contents:write token and, on purpose, has no permission to start workflows itself). This trigger runs the
  # workflow from the default branch and needs nothing from the refresh run but its end.
  workflow_run:
    workflows: ['Refresh timetables', 'Update campus map']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A refresh pass that did not publish any new calendar would rebuild and redeploy a
  # byte-identical site (twelve scheduled passes a day). This reads the pass's outcome
  # (refresh.yml uploads an artifact) and lets the build job skip those. Anything the gate
  # cannot prove -- another event, an older refresh version, a missing or damaged
  # artifact -- fails open and rebuilds.
  gate:
    name: rebuild needed?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Reading the triggering run's artifact; nothing else on the workflow.
      actions: read
    steps:
      - id: outcome
        if: github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: refresh-outcome
          path: outcome
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - id: decision
        run: |
          rebuild=true
          if [ "${{ github.event_name }}" = 'workflow_run' ] && [ "${{ steps.outcome.outcome }}" = 'success' ]; then
            value=$(jq -r '.pushed // ""' outcome/refresh-outcome.json 2>/dev/null || true)
            if [ "$value" = 'false' ]; then
              echo 'A quiet refresh pass changed nothing on the data branch; skipping the rebuild.'
              rebuild=false
            fi
          fi
          echo "rebuild=$rebuild" >> "$GITHUB_OUTPUT"

  build:
    name: build + upload
    needs: gate
    # !cancelled(): a failed gate (network glitch reading the artifact) must fail open and
    # rebuild -- missing one real update is worse than a spare build -- but a cancelled run
    # stays cancelled.
    if: ${{ !cancelled() && needs.gate.outputs.rebuild != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          path: prod
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          path: devsrc
      # Refreshed calendars live on the `data` branch (see refresh.yml). They are laid over the timetables
      # committed in each tree, so the site shows the latest plans without a commit to master or dev. Before the
      # branch exists, or if it cannot be fetched, the committed timetables are published as they are.
      - id: data
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: data
      # Calendars on `data` from before the converter dropped lecturer aliases from LOCATION would make build.py
      # refuse the build (and be published if it did not). Scrub this checkout before it is laid over the trees; the
      # branch itself is untouched, and a calendar the tool cannot verify fails the job instead of being published.
      - name: Scrub staff names from the refreshed timetables
        if: steps.data.outcome == 'success'
        run: python3 devsrc/tools/scrub_staff.py --apply data
      - name: Overlay the refreshed timetables
        if: steps.data.outcome == 'success'
        run: |
          for tree in prod devsrc; do
            if [ -d data/timetables ]; then cp -r data/timetables/. "$tree/timetables/"; fi
            if [ -f data/refresh-state.json ]; then cp data/refresh-state.json "$tree/refresh-state.json"; fi
          done
          echo "overlaid $(find data/timetables -name '*.ics' | wc -l) refreshed calendars"
      # The monthly campus map (see map.yml) lives on the `map` branch. It replaces a tree's src/map/ only when it was
      # vendored for exactly the tiles and engine that tree expects (its tools/map/coverage.json and src/map/lib/, whose
      # bytes the tree's SRI pins); otherwise, and before the branch exists, the tree keeps the map committed with it.
      - id: map
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: map
          path: mapbranch
      - name: Overlay the updated campus map
        if: steps.map.outcome == 'success'
        run: |
          for tree in prod devsrc; do
            if [ -f "$tree/tools/map/coverage.json" ] && cmp -s mapbranch/coverage.json "$tree/tools/map/coverage.json" \
               && diff -rq mapbranch/map/lib "$tree/src/map/lib" > /dev/null; then
              rm -rf "$tree/src/map" && cp -r mapbranch/map "$tree/src/map"
              echo "$tree: campus map from the map branch ($(git -C mapbranch log -1 --format=%s))"
            else
              echo "$tree: keeps the campus map committed with it"
            fi
          done
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      # base_path is "/PlanWAT" on kilerdevs.github.io and empty once a custom
      # domain is set; the 404 page's links need it.
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build the production site
        # base_url (absolute) gives the pages canonical URLs and social cards, and the site a sitemap.xml.
        # This workflow comes from the pushed branch but production is master's build.py, which may not
        # know --site-url yet (a push to dev before the release that adds it): pass it only when it does.
        run: |
          site_url=()
          if python prod/build.py --help | grep -q -- --site-url; then
            site_url=(--site-url "${{ steps.pages.outputs.base_url }}")
          fi
          python prod/build.py --out site --base-path "${{ steps.pages.outputs.base_path }}" "${site_url[@]}"
      - name: Build the dev preview
        run: python devsrc/build.py --out site/dev --base-path "${{ steps.pages.outputs.base_path }}/dev" --noindex
      # Cross-link the two front pages. Plain anchors only: no inline script or
      # style changes, so the hash-pinned CSPs stay valid.
      - name: Link production and preview
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          def add(path, link):
              p = Path(path)
              html = p.read_text(encoding='utf-8')
              assert link not in html
              # new footer keeps its links in one row; the older one just ends with </footer>
              marker = 'Zgłoś błąd</a></p>'
              if marker in html:
                  html = html.replace(marker, 'Zgłoś błąd</a>' + link + '</p>', 1)
              else:
                  assert '</footer>' in html
                  html = html.replace('</footer>', ' ' + link + '</footer>', 1)
              p.write_text(html, encoding='utf-8')
          add('site/index.html', '<a href="dev/">Wersja testowa (dev)</a>')
          add('site/dev/index.html', '<a href="../">Wersja stabilna</a>')
          print('linked production <-> dev preview')
          EOF
      # The artifact includes dotfiles for .well-known/security.txt; the build markers are internal.
      - name: Drop build markers
        run: find site -name .planwat-site -delete
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
