name: Refresh timetables

# Re-crawls the faculty timetable pages, converts what changed and pushes the calendars to the `data` branch;
# pages.yml overlays that branch over the repository's timetables/ on every deploy. See docs/REFRESH.md.
#
# Runs only on the self-hosted runner (label "planwat"): the faculty sites' Incapsula wall blocks GitHub's
# datacenter addresses on the first request, so a hosted runner can only fail.
on:
  # Off-hours (about 03:00 Warsaw time); the plans rarely change, so once a day is plenty.
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
    inputs:
      faculty:
        description: 'Comma-separated faculties, e.g. wel (empty: all enabled)'
        type: string
        default: ''

permissions:
  contents: read

# One refresh at a time, and never cancel one halfway: a half-finished crawl is resumed, not restarted.
concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Only scheduled and manual runs reach the runner, never pull requests, so a fork cannot run code on it.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, planwat]
    timeout-minutes: 240
    permissions:
      contents: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
      - uses: ./src/.github/actions/refresh
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          profile: selfhosted
          faculty: ${{ inputs.faculty }}
          max-minutes: '200'
