name: Refresh timetables

# Re-crawls the faculty timetable pages, converts what changed and pushes the calendars to the `data` branch;
# pages.yml overlays that branch over the repository's timetables/ on every deploy. See docs/REFRESH.md.
#
# Crawls only on the project's self-hosted runners (label "planwat"): the faculty sites' Incapsula wall blocks
# GitHub's datacenter addresses on the first request, so a hosted runner can only fail. There are three of them
# (tools/refresh/fleet.json): plebania, fast but often switched off; an always-on but slow VPS; and a free Northflank
# container. A hosted job asks GitHub which of them is online and splits the faculties between those; all three carry
# speed 1, so the split is even. One that is done early takes work off the others while they still crawl
# (tools/refresh/steal.py, over git refs that the report job deletes). What one of them leaves blocked or unfinished,
# another one that is online then takes over (the handoff). A last hosted job adds their outcomes up for pages.yml and
# the "blocked" issues, and records the pass in the run history (README.md on the data branch, the site's /stan/ page).
on:
  # Every two hours, round the clock: a pass over every group takes well under an hour (all policy
  # groups crawl side by side, one request at a time per host) and most pages answer 304, so a quiet
  # pass is cheap. A group checked within the last hour is skipped, so a run that overlaps a slow
  # predecessor never repeats its work while every two-hour run still covers every group.
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:
    inputs:
      faculty:
        description: 'Comma-separated faculties, e.g. wel (empty: all enabled)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  plan:
    # Only scheduled and manual runs reach the runners, never pull requests, so a fork cannot run code on them.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      shards: ${{ steps.plan.outputs.shards }}
      planned: ${{ steps.plan.outputs.planned }}
      fleet: ${{ steps.plan.outputs.fleet }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false
      # The split weighs each faculty by what it listed last time and its learned pacing; the run history says which
      # runner a faculty's wall kept out lately (fleet.py walled_runners).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: data
          sparse-checkout: |
            refresh-state.json
            refresh-runs.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Ask GitHub which runners are online
        env:
          # A fine-grained token for this repository with "Administration: Read-only" and nothing else: listing
          # self-hosted runners needs it, GITHUB_TOKEN cannot. Without it the always-on runner takes everything.
          GH_TOKEN: ${{ secrets.PLANWAT_RUNNERS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo '::warning::PLANWAT_RUNNERS_TOKEN is not set; cannot see which runners are online'
            exit 0
          fi
          if gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runners" \
              --jq '.runners[] | {name, status, busy, labels: [.labels[].name]}' > runners.jsonl; then
            jq -s . runners.jsonl > runners.json
            jq -r '.[] | "\(.name): \(.status)\(if .busy then " (busy)" else "" end) [\(.labels | join(", "))]"' runners.json
          else
            echo '::warning::could not list the self-hosted runners; the always-on runner takes everything'
          fi
      - id: plan
        env:
          FACULTY: ${{ inputs.faculty }}
        run: |
          args=(plan --state data/refresh-state.json --runs data/refresh-runs.json --faculty "$FACULTY")
          if [ -f runners.json ]; then args+=(--runners runners.json); fi
          python3 src/tools/refresh/fleet.py "${args[@]}"

  crawl:
    name: crawl (${{ matrix.runner }})
    needs: plan
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.plan.outputs.shards != '0'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: write
    uses: ./.github/workflows/refresh-crawl.yml
    with:
      runner: ${{ matrix.runner }}
      label: ${{ matrix.label }}
      faculties: ${{ matrix.faculties }}
      census: ${{ matrix.census || '' }}
      wave: 1
      wait: ${{ matrix.wait }}
      planned: ${{ needs.plan.outputs.planned }}

  # A wall stands in front of one address, not in front of the faculty: what a runner left blocked (or unfinished:
  # a crash, a time limit, a share it never started or one GitHub cancelled in its queue) goes to another runner that
  # GitHub says is online now. The plan had each runner wait a wall out only briefly when such a takeover was
  # possible. Not after the whole run was cancelled, though: that is someone's way of saying stop.
  handoff:
    needs: [plan, crawl]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.shards != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.handoff.outputs.matrix }}
      shards: ${{ steps.handoff.outputs.shards }}
      planned: ${{ steps.handoff.outputs.planned }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false
      # The takeover is weighed like the plan: by what each faculty listed last time and its pacing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: data
          sparse-checkout: |
            refresh-state.json
            refresh-runs.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Download the shares' outcomes
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: refresh-shard-1-*
          path: shards
          merge-multiple: true
      - name: Ask GitHub which runners are online now
        env:
          GH_TOKEN: ${{ secrets.PLANWAT_RUNNERS_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ] && gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runners" \
              --jq '.runners[] | {name, status, busy, labels: [.labels[].name]}' > runners.jsonl; then
            jq -s . runners.jsonl > runners.json
            jq -r '.[] | "\(.name): \(.status) [\(.labels | join(", "))]"' runners.json
          else
            echo '::warning::cannot see which runners are online; only an always-on runner may take over'
          fi
      - id: handoff
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          args=(handoff --matrix "$MATRIX" --dir shards --state data/refresh-state.json --runs data/refresh-runs.json)
          if [ -f runners.json ]; then args+=(--runners runners.json); fi
          python3 src/tools/refresh/fleet.py "${args[@]}"

  takeover:
    name: takeover (${{ matrix.runner }})
    needs: handoff
    if: ${{ !cancelled() && needs.handoff.result == 'success' && needs.handoff.outputs.shards != '0' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.handoff.outputs.matrix) }}
    permissions:
      contents: write
    uses: ./.github/workflows/refresh-crawl.yml
    with:
      runner: ${{ matrix.runner }}
      label: ${{ matrix.label }}
      faculties: ${{ matrix.faculties }}
      wave: 2
      wait: ${{ matrix.wait }}
      planned: ${{ needs.handoff.outputs.planned }}

  report:
    needs: [plan, crawl, handoff, takeover]
    # Also after a failed or skipped crawl or handoff: the outcome must be written either way (a pass with no
    # runner online included). A cancelled run has no outcome, so it must not claim a blocked one.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # The run history on the data branch (refresh-runs.json, README.md): this job's own two files, nothing else.
      contents: write
      # The "blocked" and "degraded" issues.
      issues: write
      # Where the site lives, for the history's link to its /stan/ page.
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false
      - name: Download the shares' outcomes
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: refresh-shard-*
          path: shards
          merge-multiple: true
      - id: combine
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
          HANDOFF: ${{ needs.handoff.outputs.matrix }}
          PLANNED: ${{ needs.plan.outputs.planned }}
        run: |
          python3 src/tools/refresh/fleet.py combine --matrix "$MATRIX" --handoff "${HANDOFF:-[]}" --planned "$PLANNED" \
            --dir shards --out refresh-outcome.json
      - name: File or close the issues
        if: steps.combine.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLOCKED: ${{ steps.combine.outputs.blocked }}
          INCOMPLETE: ${{ steps.combine.outputs.incomplete }}
          DEGRADED: ${{ steps.combine.outputs.degraded }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # One issue tells the owner that the crawl is blocked; it closes itself after a clean run.
          title='Odświeżanie planów zablokowane (Incapsula)'
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ "$BLOCKED" = 'true' ]; then
            body="Serwer wydziału zablokował pobieranie planów. Ostatnie poprawne plany zostają bez zmian. Przebieg: $RUN_URL"
            if [ -n "$open" ]; then
              gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
            fi
          elif [ "$INCOMPLETE" != 'true' ] && [ -n "$open" ]; then
            gh issue close "$open" --repo "$GITHUB_REPOSITORY" --comment "Pobieranie znów działa: $RUN_URL"
          fi
          # A second issue tracks degraded-but-not-blocked runs (mass skips); same open/comment/create/close pattern.
          dtitle='Odświeżanie planów zdegradowane (masowe pominięcia)'
          dopen=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$dtitle\" in:title" --json number --jq '.[0].number // empty')
          if [ "$DEGRADED" = 'true' ] && [ "$BLOCKED" != 'true' ]; then
            dbody="Przebieg odświeżania zdegradowany (masowe pominięcia), ale nie zablokowany. Ostatnie poprawne plany zostają bez zmian. Przebieg: $RUN_URL"
            if [ -n "$dopen" ]; then
              gh issue comment "$dopen" --repo "$GITHUB_REPOSITORY" --body "$dbody"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$dtitle" --body "$dbody"
            fi
          elif [ "$BLOCKED" != 'true' ] && [ "$DEGRADED" != 'true' ] && [ "$INCOMPLETE" != 'true' ] && [ -n "$dopen" ]; then
            gh issue close "$dopen" --repo "$GITHUB_REPOSITORY" --comment "Odświeżanie znów pełne: $RUN_URL"
          fi
      # The last passes for people to read: refresh-runs.json and README.md on the data branch (GitHub shows it at
      # the branch's root, this run's summary repeats it) and, through pages.yml, the site's /stan/ page. Each pass
      # is recorded, a stale or empty one too; a glitch here never fails the report.
      - name: Check out the run history
        id: history
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: data
          sparse-checkout: |
            refresh-state.json
            refresh-runs.json
            README.md
          sparse-checkout-cone-mode: false
      # The runners talked over refs/planwat/pass/<...>-<run id>/ while they crawled (tools/refresh/board.py): gone
      # with the pass, as are any a pass cut short left behind.
      - name: Clear the pass's work board
        if: steps.history.outcome == 'success'
        continue-on-error: true
        run: python3 src/tools/refresh/board.py sweep --repo data --run-id "$GITHUB_RUN_ID"
      - name: Record this pass in the run history
        if: steps.history.outcome == 'success'
        continue-on-error: true
        working-directory: data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
          HANDOFF: ${{ needs.handoff.outputs.matrix }}
          FLEET: ${{ needs.plan.outputs.fleet }}
          PLANNED: ${{ needs.plan.outputs.planned }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name 'planwat-refresh'
          git config user.email 'planwat-refresh@users.noreply.github.com'
          runs="$GITHUB_WORKSPACE/src/tools/refresh/runs.py"
          site=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.html_url // empty' 2>/dev/null || true)
          # Another pass's runner or report may push meanwhile: each attempt starts from the branch's newest commit
          # and adds this pass to the history found there.
          for attempt in 1 2 3 4 5; do
            if [ "$attempt" -gt 1 ]; then
              git fetch -q --depth 1 origin data
              git reset -q --hard FETCH_HEAD
            fi
            python3 "$runs" record --matrix "$MATRIX" --handoff "${HANDOFF:-[]}" --plan "$FLEET" --planned "$PLANNED" \
              --dir "$GITHUB_WORKSPACE/shards" --state refresh-state.json --runs refresh-runs.json --readme README.md \
              --run-id "$GITHUB_RUN_ID" --run-number "$GITHUB_RUN_NUMBER" --attempt "$GITHUB_RUN_ATTEMPT" \
              --event "$EVENT" --url "$RUN_URL" --site-url "${site:+${site%/}/stan/}" \
              --outcome "$GITHUB_WORKSPACE/refresh-outcome.json"
            git add refresh-runs.json README.md
            if git diff --cached --quiet || { git commit -q -m "Run history: pass #$GITHUB_RUN_NUMBER" && git push -q origin HEAD:data; }; then
              python3 "$runs" render --summary --runs refresh-runs.json --site-url "${site:+${site%/}/stan/}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "the data branch moved under the push (attempt $attempt); recording again"
            sleep $((attempt * 3 + RANDOM % 5))
          done
          exit 1
      # pages.yml's gate reads this instead of rebuilding an identical site after every quiet
      # pass: pushed=false (every share quiet) means the data branch is unchanged, history=new that
      # this pass ended differently from the one before it, so /stan/ should show it now. A missing or
      # damaged artifact, or a share that never reported, fails the gate open, i.e. it still rebuilds.
      # Uploaded last, after the history step added its field, whatever the steps before it did.
      - name: Upload the outcome
        if: ${{ !cancelled() && steps.combine.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refresh-outcome
          path: refresh-outcome.json
          retention-days: 2
          # a re-run of the report replaces the first attempt's (pages.yml reads the newest)
          overwrite: true
