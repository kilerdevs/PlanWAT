name: Refresh timetables

# Re-crawls the faculty timetable pages, converts what changed and pushes the calendars to the `data` branch;
# pages.yml overlays that branch over the repository's timetables/ on every deploy. See docs/REFRESH.md.
#
# Runs only on the self-hosted runner (label "planwat"): the faculty sites' Incapsula wall blocks GitHub's
# datacenter addresses on the first request, so a hosted runner can only fail.
on:
  # Every two hours, round the clock: a pass over every group takes well under an hour (all policy
  # groups crawl side by side, one request at a time per host) and most pages answer 304, so a quiet
  # pass is cheap. A group checked within the last hour is skipped, so a run that overlaps a slow
  # predecessor never repeats its work while every two-hour run still covers every group.
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:
    inputs:
      faculty:
        description: 'Comma-separated faculties, e.g. wel (empty: all enabled)'
        type: string
        default: ''

permissions:
  contents: read

# One refresh at a time, and never cancel one halfway: a half-finished crawl is resumed, not restarted.
concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Only scheduled and manual runs reach the runner, never pull requests, so a fork cannot run code on it.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, planwat]
    timeout-minutes: 110
    permissions:
      # Least privilege on purpose (see docs/REFRESH.md "If GitHub is compromised"):
      # contents pushes the data branch, issues files the blocked notice. In particular there is
      # no actions:write: the daily pages.yml rebuild picks refreshed calendars up on its own,
      # so a stolen token cannot trigger arbitrary workflows.
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
      - uses: ./src/.github/actions/refresh
        id: refresh
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          profile: selfhosted
          faculty: ${{ inputs.faculty }}
          max-minutes: '90'
      # pages.yml's gate reads this instead of rebuilding an identical site after every quiet
      # pass: pushed=false (a quiet pass, a block, a crash) means the data branch is unchanged.
      # A missing or damaged artifact fails the gate open, i.e. it still rebuilds.
      - name: Write the outcome for the Pages gate
        if: always()
        env:
          PUSHED: ${{ steps.refresh.outputs.pushed || 'false' }}
          CHANGED: ${{ steps.refresh.outputs.changed || '0' }}
          BLOCKED: ${{ steps.refresh.outputs.blocked || 'false' }}
        run: |
          printf '{"pushed": "%s", "changed": "%s", "blocked": "%s"}\n' \
            "$PUSHED" "$CHANGED" "$BLOCKED" > refresh-outcome.json
      - name: Upload the outcome
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refresh-outcome
          path: refresh-outcome.json
          retention-days: 2
