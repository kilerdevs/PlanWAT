name: SAST

# CodeQL over the JavaScript that runs in visitors' browsers (src/, including the
# inline scripts in the HTML templates), the Python build tooling and the
# workflows themselves. A weekly sweep lets new queries catch old code.

on:
  push:
    branches: [dev]  # not master: the release PR already ran these checks, so a merge does not run them again
  pull_request:
    branches: [master, dev]
  schedule:
    - cron: '41 4 * * 1'

# Same dedup reasoning as CI: one group per ref, never cancel master.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
