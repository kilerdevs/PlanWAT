name: SAST

# CodeQL over the JavaScript that runs in visitors' browsers (src/, including the
# inline scripts in the HTML templates), the Python build tooling and the
# workflows themselves. A weekly sweep lets new queries catch old code.

on:
  pull_request:
    branches: [master, dev]
  schedule:
    - cron: '41 4 * * 1'
  # No push trigger on purpose: the dev -> master PR re-runs the same commit,
  # so a push shakeout would double the ~8 min CodeQL bill for nothing. Direct
  # pushes to dev stay covered by the Monday cron sweep.

# Same dedup reasoning as CI: one group per ref, never cancel master.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
