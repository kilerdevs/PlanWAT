name: Documentation issue
description: Something in the docs is wrong, missing, unclear or out of date
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Documentation claims in this project are meant to match the code. If they don't, that is a bug worth reporting.

  - type: input
    id: location
    attributes:
      label: Where is it?
      description: File and section, or a link.
      placeholder: docs/ICS-FORMAT.md → Event properties
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
    validations:
      required: false
