worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset      utf-8;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Behind a reverse proxy, add set_real_ip_from <proxy address> and real_ip_header <its client-IP header>
    # here, so logs and the per-IP limits below see the visitor instead of the proxy.

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';
    access_log /dev/stdout main;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 15s;

    # Static site: no request bodies, small headers, short timeouts.
    client_max_body_size        0k;
    client_body_buffer_size     1k;
    client_header_buffer_size   1k;
    large_client_header_buffers 4 8k;
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          10s;

    limit_req_zone  $binary_remote_addr zone=perip:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=connip:10m;

    gzip on;
    # The default comp level (1) leaves a chunk of the ~340 KB pages on the table; level 5
    # costs only a little more CPU at the request rate this site sees. gzip_vary keeps
    # intermediate caches honest.
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/calendar;

    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;

        limit_req  zone=perip burst=40 nodelay;
        limit_conn connip 20;
        limit_req_status  429;
        limit_conn_status 429;

        if ($request_method !~ ^(GET|HEAD)$) { return 405; }

        # Placeholder: `python3 build.py --nginx <copy of this file>` (run by the Dockerfile) pins the
        # inline-code hashes and shared-asset origins of every built page here, plus frame-ancestors
        # (header-only).
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cache-Control "no-cache" always;

        # site/ from build.py: /, /<GROUP>/ (index.html + plan.ics), /404.html
        index index.html;
        absolute_redirect off;
        error_page 404 /404.html;

        location / {
            try_files $uri $uri/ =404;
        }
        # timetables: read by the group page, also subscribable from calendar apps
        location ~ \.ics$ {
            types { text/calendar ics; }
            charset_types text/calendar;
            try_files $uri =404;
        }
        # web app manifests (not in every nginx mime.types)
        location ~ \.webmanifest$ {
            types { application/manifest+json webmanifest; }
            try_files $uri =404;
        }
        # security.txt (RFC 9116); a prefix match, so the dotfile rule below does not apply
        location ^~ /.well-known/ {
            default_type text/plain;
            try_files $uri =404;
        }
        # build marker and any other dotfile
        location ~ /\. {
            return 404;
        }
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
