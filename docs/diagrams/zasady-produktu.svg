<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif">
  <title id="t">Zasady produktu PlanWAT</title>
  <desc id="d">Sześć zasad: jedno spojrzenie odpowiada na co, kiedy, gdzie; telefon najpierw i płynnie; link jest produktem; uczciwie i nieoficjalnie; bez kont i bez e-maila; rośnie bez utraty widoku jednej grupy.</desc>
  <rect width="800" height="400" rx="18" fill="#0b0f17"/>
  <text x="400" y="38" text-anchor="middle" fill="#f5f5f7" font-size="18" font-weight="700">Sześć zasad, od których się nie odchodzi</text>

  <g fill="#1c1c1e" stroke="#2c2c2e" stroke-width="1.5">
    <rect x="30"  y="64"  width="232" height="142" rx="16"/>
    <rect x="284" y="64"  width="232" height="142" rx="16"/>
    <rect x="538" y="64"  width="232" height="142" rx="16"/>
    <rect x="30"  y="224" width="232" height="132" rx="16"/>
    <rect x="284" y="224" width="232" height="132" rx="16"/>
    <rect x="538" y="224" width="232" height="132" rx="16"/>
  </g>
  <g fill="#0a84ff">
    <circle cx="58"  cy="92"  r="14"/><circle cx="312" cy="92"  r="14"/><circle cx="566" cy="92"  r="14"/>
    <circle cx="58"  cy="252" r="14"/><circle cx="312" cy="252" r="14"/><circle cx="566" cy="252" r="14"/>
  </g>
  <g fill="#fff" font-size="14" font-weight="700" text-anchor="middle">
    <text x="58" y="97">1</text><text x="312" y="97">2</text><text x="566" y="97">3</text>
    <text x="58" y="257">4</text><text x="312" y="257">5</text><text x="566" y="257">6</text>
  </g>
  <g fill="#f5f5f7" font-size="14.5" font-weight="650">
    <text x="82"  y="97">Jedno spojrzenie</text>
    <text x="336" y="97">Telefon najpierw</text>
    <text x="590" y="97">Link jest produktem</text>
    <text x="82"  y="257">Uczciwie i nieoficjalnie</text>
    <text x="336" y="257">Bez kont i bez e-maila</text>
    <text x="590" y="257">Rośnie, nie komplikuje</text>
  </g>
  <g fill="#a1a1a6" font-size="12.5">
    <text x="46" y="128">Co, kiedy, gdzie:</text>
    <text x="46" y="148">bieżący tydzień, trwające</text>
    <text x="46" y="168">zajęcia i sala wyprzedzają</text>
    <text x="46" y="188">wszystko inne.</text>

    <text x="300" y="128">Płynnie na zwykłym telefonie.</text>
    <text x="300" y="148">Przyjemność nigdy nie</text>
    <text x="300" y="168">kosztuje przewijania</text>
    <text x="300" y="188">ani czasu ładowania.</text>

    <text x="554" y="128">Jeden stały adres w czacie</text>
    <text x="554" y="148">grupy zawsze pokazuje</text>
    <text x="554" y="168">właściwy tydzień każdemu,</text>
    <text x="554" y="188">kto go otworzy.</text>

    <text x="46" y="292">Widok oficjalnego planu.</text>
    <text x="46" y="312">W sprawach wiążących</text>
    <text x="46" y="332">odsyła do e-dziekanatu.</text>

    <text x="300" y="292">Plan jest publiczny, więc nie</text>
    <text x="300" y="312">ma logowania, hasła ani</text>
    <text x="300" y="332">zbierania adresów e-mail.</text>

    <text x="554" y="292">Kolejne grupy i wydziały nie</text>
    <text x="554" y="312">psują prostego widoku</text>
    <text x="554" y="332">jednej grupy.</text>
  </g>
</svg>
