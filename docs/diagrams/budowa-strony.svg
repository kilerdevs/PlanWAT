<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif">
  <title id="t">Jak powstaje strona PlanWAT</title>
  <desc id="d">Pliki kalendarza .ics w katalogu timetables przechodzą przez build.py, który waliduje je i zapisuje statyczną stronę z hashowanym CSP. Strona trafia na GitHub Pages albo do obrazu Docker z nginx.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#0a84ff"/></marker>
  </defs>
  <rect width="800" height="330" rx="18" fill="#0b0f17"/>
  <text x="400" y="36" text-anchor="middle" fill="#f5f5f7" font-size="18" font-weight="700">Od pliku .ics do strony na telefonie</text>

  <g fill="#1c1c1e" stroke="#2c2c2e" stroke-width="1.5">
    <rect x="30" y="76" width="190" height="86" rx="14"/>
    <rect x="305" y="76" width="190" height="86" rx="14"/>
    <rect x="580" y="76" width="190" height="86" rx="14"/>
    <rect x="305" y="214" width="190" height="72" rx="14"/>
    <rect x="580" y="214" width="190" height="72" rx="14"/>
  </g>
  <g fill="#f5f5f7" font-size="14" font-weight="600" text-anchor="middle">
    <text x="125" y="108">timetables/&lt;semestr&gt;</text>
    <text x="400" y="108">python3 build.py</text>
    <text x="675" y="108">site/</text>
    <text x="400" y="246">GitHub Pages</text>
    <text x="675" y="246">Obraz Docker</text>
  </g>
  <g fill="#a1a1a6" font-size="12" text-anchor="middle">
    <text x="125" y="130">&lt;GRUPA&gt;.ics</text>
    <text x="125" y="148">źródło prawdy</text>
    <text x="400" y="130">waliduje kalendarze,</text>
    <text x="400" y="148">wybiera bieżący semestr</text>
    <text x="675" y="130">strona grupy, plan.ics,</text>
    <text x="675" y="148">CSP z hashami</text>
    <text x="400" y="266">wdrożenie przy każdym pushu</text>
    <text x="675" y="266">nginx tylko do odczytu</text>
  </g>
  <g stroke="#0a84ff" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M220 119H299"/>
    <path d="M495 119H574"/>
    <path d="M640 162V188H400V208"/>
    <path d="M710 162V208"/>
  </g>
  <g fill="#86868b" font-size="12" text-anchor="middle">
    <text x="262" y="110">czyta</text>
    <text x="535" y="110">zapisuje</text>
  </g>
  <rect x="30" y="214" width="190" height="72" rx="14" fill="#1c1c1e" stroke="#0a84ff" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="125" y="246" text-anchor="middle" fill="#f5f5f7" font-size="14" font-weight="600">gałąź data</text>
  <text x="125" y="266" text-anchor="middle" fill="#a1a1a6" font-size="12">świeże kalendarze z crawlera</text>
  <path d="M125 214V176" stroke="#0a84ff" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="140" y="198" fill="#86868b" font-size="12">nakładka</text>
</svg>
