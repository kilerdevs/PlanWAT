<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif">
  <title id="t">Co dzieje się po otwarciu linku do grupy</title>
  <desc id="d">Student pobiera stronę z GitHub Pages, potem plik plan.ics. Przeglądarka renderuje tydzień, a Service Worker zapisuje kopię. Bez sieci pokazywana jest ostatnia zapisana kopia z informacją o trybie offline.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0a84ff"/></marker>
  </defs>
  <rect width="800" height="400" rx="18" fill="#0b0f17"/>
  <text x="400" y="36" text-anchor="middle" fill="#f5f5f7" font-size="18" font-weight="700">Od linku do tygodnia na ekranie</text>

  <g fill="#1c1c1e" stroke="#2c2c2e" stroke-width="1.5">
    <rect x="65" y="58" width="150" height="40" rx="12"/>
    <rect x="325" y="58" width="150" height="40" rx="12"/>
    <rect x="585" y="58" width="150" height="40" rx="12"/>
  </g>
  <g fill="#f5f5f7" font-size="14" font-weight="600" text-anchor="middle">
    <text x="140" y="83">Student</text>
    <text x="400" y="83">GitHub Pages</text>
    <text x="660" y="83">Service Worker</text>
  </g>
  <g stroke="#2c2c2e" stroke-width="2" stroke-dasharray="4 6">
    <path d="M140 98V316"/>
    <path d="M400 98V316"/>
    <path d="M660 98V316"/>
  </g>

  <g stroke="#0a84ff" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M140 140H394"/>
    <path d="M400 180H146" stroke-dasharray="6 5"/>
    <path d="M140 220H394"/>
    <path d="M400 260H146" stroke-dasharray="6 5"/>
    <path d="M140 300H654"/>
  </g>
  <g fill="#a1a1a6" font-size="12.5" text-anchor="middle">
    <text x="270" y="132">1 · GET /WCY26KY3S1/</text>
    <text x="270" y="172">2 · strona (HTML + CSP z hashami)</text>
    <text x="270" y="212">3 · GET plan.ics</text>
    <text x="270" y="252">4 · kalendarz, bajt w bajt</text>
    <text x="400" y="292">5 · zapis kopii na później</text>
  </g>

  <rect x="190" y="334" width="420" height="44" rx="12" fill="#1c1c1e" stroke="#0a84ff" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="400" y="353" text-anchor="middle" fill="#f5f5f7" font-size="12.5" font-weight="600">ics.js renderuje tydzień, karta „Teraz” liczy się lokalnie</text>
  <text x="400" y="369" text-anchor="middle" fill="#a1a1a6" font-size="12">bez sieci: ostatnia kopia z informacją, że to wersja offline</text>
</svg>
