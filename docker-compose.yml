name: plan-wat

services:
  plan-wat:
    build: .
    image: plan-wat:latest
    container_name: PLAN-WAT
    restart: always
    # Localhost only: publish it through a reverse proxy that terminates TLS.
    ports:
      - "127.0.0.1:8088:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    ulimits:
      nofile: 4096
    networks:
      - plan-wat
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  plan-wat:
    driver: bridge
