# Merge into <runner dir>/compose.yml (do NOT replace the file blindly).
# The egress rotator keeps tinyproxy's threat model (default-deny, port 443/80
# only) but chains *.wat.edu.pl through rotating public proxies. tinyproxy
# stays up during the transition as the rollback path (runner points back at
# <proxy-ip>:8888).
services:
  egress:
    build:
      context: ./egress  # scp tools/egress/ to <runner dir>/egress/ on deploy
      dockerfile: Dockerfile.egress
    image: planwat/egress:1
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 256m
    pids_limit: 256
    ulimits:
      nofile: 4096
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      EGRESS_DATA: /data
      # Shared secret for the GUI API: every POST (/api/run, /api/block, /api/progress, /api/refresh)
      # and, once set, the reads too (the panel, /api/progress and the full /api/status; browsers sign
      # in at /login, healthchecks still get a bare 200 from /api/status). Set the same value on the
      # runner's refresh action (or its compose env). Empty = no auth: keep the port on localhost then.
      EGRESS_API_TOKEN: "${EGRESS_API_TOKEN:-}"
      # Fall back to direct egress when the pool is empty (fail-open, operator choice).
      # Set to 0 for DeadDropMGMT-style fail-closed (crawl stops instead).
      PLANWAT_EGRESS_DIRECT_FALLBACK: "1"
      # Exception to the fail-open rule: WCY is blocked from this box's own line and only
      # reachable through the pool, so it must never leak direct. A host named here stays on the
      # pool even if EGRESS_DIRECT_FACULTY lists it too (the egress logs a warning at start).
      EGRESS_FAIL_CLOSED: "planzajec.wcy.wat.edu.pl"
      # Faculty hosts that bypass the pool and go out from this box's own line. The pool's
      # public exits answer them with WAF block pages (WTC the worst), while the home line
      # serves them fine. Deliberately NOT listed: planzajec.wcy.wat.edu.pl — that one is
      # blocked from the home line and can only be reached through the pool.
      EGRESS_DIRECT_FACULTY: "wlo.wat.edu.pl,wel.wat.edu.pl,www.wim.wat.edu.pl,ioe.wat.edu.pl,wml.wat.edu.pl,wtc.wat.edu.pl"
    # Pin resolvers: Docker snapshots the host's /etc/resolv.conf when a container starts, so a
    # container that starts before DHCP has written it can resolve nothing for the rest of its
    # life (seen 2026-10-17: runner offline with proxy 502s after a host reboot).
    dns:
      - 1.1.1.1
      - 9.9.9.9
    volumes:
      - egress-data:/data
    ports:
      # Monitoring GUI (host port 18080: 8080 was taken by cAdvisor on the runner host), on localhost
      # only: reach it over an SSH tunnel (ssh -L 18080:127.0.0.1:18080 <host>). To open it to the
      # LAN, bind the LAN address instead ("<lan-ip>:18080:8080") and set EGRESS_API_TOKEN first.
      # The runner reaches the GUI over the inner network, which this binding does not touch.
      - "127.0.0.1:18080:8080"
    healthcheck:
      # Quoteless on purpose: compose+shell layers eat quotes. DNS + TCP to GitHub is what the
      # runner actually needs from this box; a listener-only check stays green through a DNS outage.
      test: ["CMD", "python", "-c", "import socket;socket.create_connection((chr(103)+chr(105)+chr(116)+chr(104)+chr(117)+chr(98)+chr(46)+chr(99)+chr(111)+chr(109),443),timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      inner:
        ipv4_address: <egress-ip>
      egress: {}

volumes:
  egress-data:

# Cutover (after `up -d --build egress` + GUI shows ROTATING):
#   runner.environment: HTTP_PROXY/HTTPS_PROXY/http_proxy/https_proxy ->
#     http://<egress-ip>:8888, then `up -d runner`.
# Rollback: point the runner back at http://<proxy-ip>:8888, `up -d runner`.
